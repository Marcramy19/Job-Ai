name: Daily Job Scraper

on:
  # Runs automatically every 12 hours (adjust as needed)
  schedule:
    - cron: '0 */12 * * *' 
  # Allows you to click a button on GitHub to run it manually right now
  workflow_dispatch: 

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install playwright python-telegram-bot groq
          # Install the browser and its Linux dependencies
          playwright install chromium
          playwright install-deps chromium

      - name: Run Job Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_agent.py
